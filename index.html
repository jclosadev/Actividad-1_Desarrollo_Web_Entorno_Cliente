<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Carrito de Josep Closa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        input[type="number"] {
            width: 50px;
        }

        .total-box {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Carrito de Josep Closa</h2>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="lista-productos">
            <!-- Los productos se cargan dinámicamente -->
        </tbody>
    </table>

    <div class="total-box">
        Total: <span id="precio-total">0.00</span> <span id="moneda">€</span>
    </div>

    <script src="Carrito.js"></script>
    <script src="app.js"></script>
</body>

</html>
